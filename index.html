<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNN NETWORK</title>
<meta name="description" content="All BNN NETWORK official links & messages in one hub.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f8fb; --bg2:#eef1f6; --card:#ffffff; --text:#12203a; --muted:#5b6b85;
  --accent:#d32f2f; --accent2:#14305b; --border:#e3e7ef; --chip:#fdecec;
  --bar:rgba(255,255,255,.88); --shadow:0 10px 30px rgba(18,32,58,.08);
}
html[data-theme="dark"]{
  --bg:#0b0f14; --bg2:#10161d; --card:#131b25; --text:#eef2f7; --muted:#8fa3b3;
  --accent:#ff4d4d; --accent2:#8ab4ff; --border:#202b38; --chip:#2a1416;
  --bar:rgba(11,15,20,.88); --shadow:0 10px 30px rgba(0,0,0,.5);
}
body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Sinhala',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s}
/* ---------- HEADER ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px}
.logo3d{display:inline-grid;perspective:600px}
.logo3d svg,.logo3d img{width:42px;height:46px;animation:spinY 8s linear infinite;transform-style:preserve-3d;filter:drop-shadow(0 4px 10px rgba(211,47,47,.35))}
@keyframes spinY{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.logo3d svg,.logo3d img{animation:none}}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-badge{background:var(--accent);color:#fff;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:800;letter-spacing:2px;width:max-content}
.brand-text strong{font-size:19px;letter-spacing:2px;font-weight:800}
.controls{display:flex;gap:8px;align-items:center}
.lang{padding:9px 10px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;cursor:pointer}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:18px;cursor:pointer}
.icon-btn:hover{border-color:var(--accent)}
/* ---------- TABS ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:14px;font-weight:600}
.tab b{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.on b{background:rgba(255,255,255,.28)}
/* ---------- SEARCH ---------- */
.searchbar{max-width:640px;margin:0 auto;padding:4px 16px 0;text-align:center}
.searchbar label{font-weight:700;font-size:15px;display:block;margin-bottom:8px}
.searchbar input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;outline:none}
.searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--chip)}
.searchbar em{display:block;color:var(--muted);font-size:12px;margin-top:8px;font-style:normal}
/* ---------- MAIN / HERO ---------- */
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:8px 16px 40px}
.hero{text-align:center;padding:30px 6px 6px}
.hero-badge{display:inline-block;background:var(--chip);color:var(--accent);padding:9px 20px;border-radius:999px;font-weight:800;letter-spacing:2px;font-size:12px}
.hero h1{font-size:clamp(28px,6vw,46px);margin:18px auto 12px;max-width:720px;line-height:1.15}
.hero>p{color:var(--muted);max-width:660px;margin:0 auto 18px;line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:26px}
.chip{border:1px solid var(--border);background:var(--card);padding:8px 14px;border-radius:999px;color:var(--muted);font-size:13px}
.hub-card{max-width:600px;margin:0 auto;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.hub-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.hub-head h2{font-size:22px}
.hub-head p{color:var(--muted);font-size:14px;margin-top:2px}
.hub-logo{font-size:34px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border-radius:16px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--text)}
.stat span{font-size:20px}.stat b{font-size:18px;color:var(--accent)}.stat i{font-style:normal;font-size:12px;color:var(--muted)}
.stat:hover{border-color:var(--accent)}
/* ---------- LIST / CARDS ---------- */
.list-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px;gap:10px}
.list-head h2{font-size:20px}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.chead h3{font-size:16px;line-height:1.35}
.plats{font-size:15px;white-space:nowrap}
.prev{color:var(--muted);font-size:13.5px;line-height:1.55;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.lrows{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:13px}
.lrow em{font-style:normal;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow i{font-style:normal;color:var(--accent)}
.lrow:hover{border-color:var(--accent)}
.more-lbl{color:var(--muted);font-size:12px}
.more{margin-top:auto;background:var(--chip);color:var(--accent);border:none;padding:10px;border-radius:12px;font-weight:700;cursor:pointer;font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;line-height:1.8}
footer{text-align:center;padding:20px;color:var(--muted);font-size:13px;border-top:1px solid var(--border)}
/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100;backdrop-filter:blur(3px)}
.overlay[hidden]{display:none}
.modal{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:22px;position:relative}
.close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:18px;cursor:pointer}
.modal h3{padding-right:44px;font-size:19px;line-height:1.4}
.m-plats{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pchip{background:var(--chip);color:var(--accent);font-size:12px;padding:4px 10px;border-radius:999px;font-weight:700}
.modal pre{white-space:pre-wrap;word-break:break-word;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;max-height:38vh;overflow:auto;font-family:inherit;font-size:13.5px;line-height:1.6}
.modal h4{margin:14px 0 4px;font-size:15px}
.lgroup h5{margin:12px 0 6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo3d" aria-hidden="true">
      <!-- BNN NETWORK cube logo (spinning). ඔයාගේ photo logo එකම ඕන නම් මේ <svg>...</svg> ටිකම අයින් කරලා මේක දාන්න: <img src="logo.png" alt="BNN NETWORK"> -->
      <svg viewBox="0 0 120 128">
        <polygon points="60,6 112,34 112,92 60,120 8,92 8,34" fill="#d32f2f"/>
        <polygon points="60,6 112,34 60,62 8,34" fill="#e53935"/>
        <polygon points="8,34 60,62 60,120 8,92" fill="#c62828"/>
        <polygon points="112,34 60,62 60,120 112,92" fill="#b71c1c"/>
        <polygon points="52,11 104,39 94,45 42,17" fill="#f4f4f4"/>
        <polygon points="31,22 83,50 73,56 21,28" fill="#f4f4f4"/>
        <polygon points="8,65 60,93 60,105 8,77" fill="#f4f4f4"/>
        <polygon points="112,65 60,93 60,105 112,77" fill="#f4f4f4"/>
        <g stroke="#14305b" stroke-width="5" fill="none" stroke-linecap="round">
          <path d="M8,34 L60,62 L112,34"/><path d="M60,62 L60,120"/>
        </g>
        <polygon points="60,6 112,34 112,92 60,120 8,92 8,34" fill="none" stroke="#14305b" stroke-width="7" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="brand-text"><small class="brand-badge">BNN</small><strong>NETWORK</strong></span>
  </div>
  <div class="controls">
    <select id="langSel" class="lang" title="Language">
      <option value="en">English</option>
      <option value="si">සිංහල</option>
    </select>
    <button id="themeBtn" class="icon-btn" title="Theme">🌙</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<div class="searchbar">
  <label for="searchInput" data-i18n="searchTitle"></label>
  <input id="searchInput" type="search">
  <em data-i18n="searchDesc"></em>
</div>

<main>
  <section id="hero" class="hero">
    <span class="hero-badge" data-i18n="heroBadge"></span>
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroDesc"></p>
    <div class="chips">
      <span class="chip" data-i18n="chip1"></span>
      <span class="chip" data-i18n="chip2"></span>
      <span class="chip" data-i18n="chip3"></span>
      <span class="chip" data-i18n="chip4"></span>
    </div>
    <div class="hub-card">
      <div class="hub-head">
        <div><h2 data-i18n="hubTitle"></h2><p data-i18n="hubSub"></p></div>
        <span class="hub-logo">🐝</span>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <section id="listSec" hidden>
    <div class="list-head"><h2 id="listTitle"></h2><span id="countLbl" class="count"></span></div>
    <div id="cards" class="cards"></div>
  </section>
</main>

<footer><span data-i18n="footer"></span></footer>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="close" id="modalClose" title="Close">×</button>
    <h3 id="mTitle"></h3>
    <div id="mPlats" class="m-plats"></div>
    <pre id="mMsg"></pre>
    <h4 data-i18n="links"></h4>
    <div id="mLinks"></div>
  </div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const tabsEl=$('#tabs'),statsEl=$('#stats'),cardsEl=$('#cards'),listSec=$('#listSec'),hero=$('#hero'),
listTitle=$('#listTitle'),countLbl=$('#countLbl'),overlay=$('#overlay'),searchInput=$('#searchInput'),
themeBtn=$('#themeBtn'),langSel=$('#langSel');

const I18N={
 en:{tabs:{home:'Home',all:'All',telegram:'Telegram',whatsapp:'WhatsApp',youtube:'YouTube',discord:'Discord',website:'Website',instagram:'Instagram',tiktok:'TikTok',facebook:'Facebook'},
  searchTitle:'Find messages',searchDesc:'Type a name to find its message and links.',searchPh:'Search by name…',
  heroBadge:'🐝 100% FREE FOREVER',heroTitle:'All BNN NETWORK Links in One Place',
  heroDesc:'Channels, groups, bots, websites and social pages — automatically sorted into tabs from messages.json.',
  chip1:'⚡ Auto-sorted tabs',chip2:'🔍 Instant search',chip3:'🌗 Dark / Light theme',chip4:'🌐 English / සිංහල',
  hubTitle:'BNN NETWORK Hub',hubSub:'Connect 100% Free',details:'View full message',links:'Links',
  noResults:'No results found.',items:'items',footer:'BNN NETWORK © 2026',
  errTitle:"Couldn't load messages.json",errDesc:'Make sure messages.json is next to index.html and the site is served over http(s).'},
 si:{tabs:{home:'මුල් පිටුව',all:'සියල්ල',telegram:'Telegram',whatsapp:'WhatsApp',youtube:'YouTube',discord:'Discord',website:'Website',instagram:'Instagram',tiktok:'TikTok',facebook:'Facebook'},
  searchTitle:'මැසේජ් සොයන්න',searchDesc:'නමක් type කරලා, ඒ නමට අදාළ මැසේජ් සහ link එක සොයාගන්න.',searchPh:'නමක් type කරන්න…',
  heroBadge:'🐝 100% FREE FOREVER',heroTitle:'BNN NETWORK Link සියල්ල එකම තැනක',
  heroDesc:'Channels, groups, bots, websites සහ social pages ඔක්කොම messages.json එකෙන් auto වැටෙන tabs වලින්.',
  chip1:'⚡ Auto tabs',chip2:'🔍 Search',chip3:'🌗 Theme',chip4:'🌐 භාෂා 2',
  hubTitle:'BNN NETWORK Hub',hubSub:'100% Free සම්බන්ධ වන්න',details:'සම්පූර්ණ මැසේජ් එක බලන්න',links:'Links',
  noResults:'Results නැහැ.',items:'items',footer:'BNN NETWORK © 2026',
  errTitle:'messages.json load කරගන්න බැරි වුණා',errDesc:'messages.json file එක index.html එක ළඟම තියෙනවද බලලා, site එක http(s) server එකකින් open කරන්න.'}
};
const PLATFORMS=[
 {id:'telegram',re:/t\.me\/|telegram\./},{id:'whatsapp',re:/whatsapp\.com|wa\.me/},
 {id:'youtube',re:/youtube\.com|youtu\.be/},{id:'discord',re:/discord\.(gg|com|io)/},
 {id:'instagram',re:/instagram\.com/},{id:'tiktok',re:/tiktok\.com/},
 {id:'facebook',re:/facebook\.com|fb\.com/}
];
const ICONS={home:'🏠',all:'🗂️',telegram:'✈️',whatsapp:'💬',youtube:'▶️',discord:'🎧',website:'🌐',instagram:'📸',tiktok:'🎵',facebook:'👍'};
const TABS=['home','all','telegram','whatsapp','youtube','discord','website','instagram','tiktok','facebook'];
let DATA=[],activeTab='home',query='';
let lang=localStorage.getItem('bnn_lang')||'en';
let theme=localStorage.getItem('bnn_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanUrl=u=>String(u).replace(/\s+/g,'');
const platOf=u=>{for(const p of PLATFORMS){if(p.re.test(u))return p.id}return 'website'};
const L=()=>I18N[lang];
const count=id=>id==='all'?DATA.length:DATA.filter(d=>d.plats.includes(id)).length;

function setTheme(t){theme=t;document.documentElement.dataset.theme=t;localStorage.setItem('bnn_theme',t);themeBtn.textContent=t==='dark'?'☀️':'🌙';}
function setLang(l){lang=l;localStorage.setItem('bnn_lang',l);langSel.value=l;applyLang();}
function applyLang(){
 const t=L();
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]||'');
 searchInput.placeholder=t.searchPh;
 document.documentElement.lang=lang;
 renderTabs();renderStats();renderList();
}
function renderTabs(){
 const t=L();
 tabsEl.innerHTML=TABS.map(id=>{
  const c=id==='home'?null:count(id);
  return `<button class="tab${id===activeTab?' on':''}" data-tab="${id}">${ICONS[id]} <span>${esc(t.tabs[id]||id)}</span>${c!=null?`<b>${c}</b>`:''}</button>`;
 }).join('');
}
function renderStats(){
 const t=L();const order=['all',...PLATFORMS.map(p=>p.id),'website'];
 statsEl.innerHTML=order.map(id=>{const c=count(id);if(!c)return '';
  return `<button class="stat" data-tab="${id}"><span>${ICONS[id]}</span><b>${c}</b><i>${esc(t.tabs[id]||id)}</i></button>`;}).join('');
}
function cardHTML(d,i){
 const t=L();
 const links=(activeTab==='all'||activeTab==='home')?d.links:d.links.filter(l=>l.plat===activeTab);
 const shown=links.slice(0,4),extra=links.length-shown.length;
 return `<article class="card" data-i="${i}">
  <div class="chead"><h3>${esc(d.name)}</h3><span class="plats">${d.plats.map(p=>ICONS[p]).join(' ')}</span></div>
  <p class="prev">${esc(d.message)}</p>
  <div class="lrows">${shown.map(l=>`<a class="lrow" href="${esc(l.url)}" target="_blank" rel="noopener"><span>${ICONS[l.plat]}</span><em>${esc(l.title)}</em><i>↗</i></a>`).join('')}${extra>0?`<span class="more-lbl">+${extra} more…</span>`:''}</div>
  <button class="more" data-i="${i}">${esc(t.details)}</button></article>`;
}
function renderList(){
 const t=L();
 const showList=!(activeTab==='home'&&!query);
 hero.hidden=activeTab!=='home';
 listSec.hidden=!showList;
 if(!showList)return;
 let items=DATA.map((d,i)=>({d,i}));
 if(activeTab!=='home'&&activeTab!=='all')items=items.filter(x=>x.d.plats.includes(activeTab));
 if(query){const q=query.toLowerCase();items=items.filter(x=>(x.d.name+' '+x.d.message).toLowerCase().includes(q));}
 listTitle.textContent=query?`🔍 “${query}”`:`${ICONS[activeTab]} ${t.tabs[activeTab]||activeTab}`;
 countLbl.textContent=items.length+' '+t.items;
 cardsEl.innerHTML=items.length?items.map(x=>cardHTML(x.d,x.i)).join(''):`<div class="empty">${esc(t.noResults)}</div>`;
}
function openModal(i){
 const d=DATA[i];if(!d)return;
 $('#mTitle').textContent=d.name;
 $('#mPlats').innerHTML=d.plats.map(p=>`<span class="pchip">${ICONS[p]} ${p}</span>`).join('');
 $('#mMsg').textContent=d.message;
 $('#mLinks').innerHTML=d.plats.map(p=>{const ls=d.links.filter(l=>l.plat===p);if(!ls.length)return '';
  return `<div class="lgroup"><h5>${ICONS[p]} ${p}</h5>${ls.map(l=>`<a class="lrow" href="${esc(l.url)}" target="_blank" rel="noopener"><span>${ICONS[p]}</span><em>${esc(l.title)}</em><i>↗</i></a>`).join('')}</div>`;}).join('');
 overlay.hidden=false;document.body.style.overflow='hidden';
}
function closeModal(){overlay.hidden=true;document.body.style.overflow='';}
function showErr(){
 const e=I18N.en,s=I18N.si;
 hero.hidden=false;listSec.hidden=false;listTitle.textContent='⚠️';countLbl.textContent='';
 cardsEl.innerHTML=`<div class="empty"><b>${e.errTitle}</b><br>${e.errDesc}<br><br><b>${s.errTitle}</b><br>${s.errDesc}</div>`;
}
async function load(){
 try{
  const r=await fetch('messages.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw 0;
  const j=await r.json();
  DATA=j.map(d=>{
   const links=(d.links||[]).map(l=>{const url=cleanUrl(l.url||'');return{url,title:l.title||url,plat:platOf(url)}});
   return{name:d.name||'?',message:d.message||'',links,plats:[...new Set(links.map(l=>l.plat))]};
  });
  applyLang();
 }catch(e){showErr();}
}

tabsEl.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;activeTab=b.dataset.tab;renderTabs();renderList();});
statsEl.addEventListener('click',e=>{const b=e.target.closest('.stat');if(!b)return;activeTab=b.dataset.tab;renderTabs();renderList();listSec.scrollIntoView({behavior:'smooth'});});
cardsEl.addEventListener('click',e=>{if(e.target.closest('a'))return;const m=e.target.closest('.more'),c=e.target.closest('.card');if(m||c)openModal(+(m||c).dataset.i);});
searchInput.addEventListener('input',()=>{query=searchInput.value.trim();renderList();});
themeBtn.addEventListener('click',()=>setTheme(theme==='dark'?'light':'dark'));

addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
