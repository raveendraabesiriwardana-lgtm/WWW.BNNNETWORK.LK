<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BNN NETWORK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C31F26;
    --red-deep:#8F151B;
    --navy:#132B4C;
    --navy-deep:#0B1D33;
    --white:#FFFFFF;
    --off:#F5F5F3;
    --ink:#1B1B1B;
    --muted:#6B7280;
    --card-border:#E7E4DE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-deep);
    font-family:'Noto Sans Sinhala','Inter',sans-serif;
    color:var(--ink);
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .top-bar{
    height:6px;
    background:linear-gradient(90deg, var(--red) 0%, var(--white) 50%, var(--navy) 100%);
  }
  .hero{
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
    padding:32px 20px 56px;
    text-align:center;
    color:var(--white);
  }
  .logo-wrap{
    width:150px;
    height:150px;
    margin:0 auto 18px;
    background:var(--white);
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .logo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .hero h1{
    font-family:'Fraunces',serif;
    font-weight:800;
    font-size:clamp(26px,6vw,38px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
    color:var(--white);
  }
  .hero .tag{
    display:inline-block;
    background:var(--red);
    color:var(--white);
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    padding:5px 14px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .hero p{
    margin:0 auto;
    max-width:420px;
    color:#C9D2E0;
    font-size:15px;
    line-height:1.6;
  }
  .search-wrap{
    max-width:480px;
    margin:26px auto 0;
    padding:0 8px;
  }
  #searchInput{
    width:100%;
    padding:14px 18px;
    border-radius:999px;
    border:2px solid var(--red);
    font-size:16px;
    font-family:inherit;
    background:var(--white);
    color:var(--ink);
    outline:none;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  #searchInput:focus{
    box-shadow:0 0 0 3px rgba(195,31,38,0.35), 0 8px 24px rgba(0,0,0,0.25);
  }
  main{
    max-width:640px;
    margin:-30px auto 0;
    padding:0 16px 60px;
  }
  .status{
    background:var(--white);
    border-radius:16px;
    padding:18px 20px;
    color:var(--muted);
    text-align:center;
    font-size:14px;
  }
  .card{
    background:var(--white);
    border:1px solid var(--card-border);
    border-left:5px solid var(--red);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
  }
  .card .name{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:18px;
    color:var(--navy);
    margin:0 0 6px;
  }
  .card .msg{
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
    margin:0 0 12px;
    word-break:break-word;
  }
  .card a.go, .modal-box a.go{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--red);
    color:var(--white);
    text-decoration:none;
    font-weight:700;
    font-size:14px;
    padding:9px 16px;
    border-radius:999px;
  }
  .card a.go:hover{ background:var(--red-deep); }
  .link-title{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13.5px;
    color:var(--navy);
    background:var(--off);
    border:1px dashed var(--card-border);
    padding:8px 12px;
    border-radius:10px;
    margin:0 0 10px;
    line-height:1.5;
    word-break:break-word;
    width:100%;
  }
  .link-title b{ color:var(--red-deep); }
  .empty{
    text-align:center;
    color:#C9D2E0;
    padding:40px 20px;
    font-size:15px;
  }
  .card .actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .card a.desc-btn, .card button.desc-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--off);
    color:var(--navy);
    border:1px solid var(--card-border);
    text-decoration:none;
    font-weight:700;
    font-size:14px;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
  }
  .card button.desc-btn:hover{ background:#ECE9E1; }

  /* Modal */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(11,29,51,0.6);
    z-index:1000;
    padding:20px 14px;
    padding-top:calc(20px + env(safe-area-inset-top,0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;
  }
  .modal-overlay.open{ display:flex; align-items:flex-start; justify-content:center; }
  .modal-box{
    background:var(--white);
    border-radius:18px;
    max-width:560px;
    width:100%;
    padding:22px 22px 24px;
    position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .modal-box .modal-name{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:19px;
    color:var(--navy);
    margin:0 0 12px;
    padding-right:30px;
  }
  .modal-box .modal-msg{
    font-size:15px;
    line-height:1.7;
    color:var(--ink);
    white-space:pre-wrap;
    word-break:break-word;
    margin:0 0 16px;
    max-height:60vh;
    overflow-y:auto;
  }
  .modal-close{
    position:absolute;
    top:16px;
    right:16px;
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    background:var(--off);
    color:var(--navy);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  footer{
    text-align:center;
    padding:20px 16px 30px;
    color:#8A93A6;
    font-size:12.5px;
  }
</style>
</head>
<body>

  <div class="top-bar"></div>

  <div class="hero">
    <div class="logo-wrap">
      <img src="logo.png" alt="BNN Network Logo" />
    </div>
    <span class="tag">BNN NETWORK</span>
    <h1>මැසේජ් සොයන්න</h1>
    <p>නමක් type කරලා, ඒ නමට අදාළ මැසේජ් සහ link එක සොයාගන්න.</p>
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="නම type කරන්න... (උදා: Kasun)" autocomplete="off" />
    </div>
  </div>

  <main>
    <div id="content">
      <div class="status">Loading...</div>
    </div>
  </main>

  <footer>BNN NETWORK &copy; 2026</footer>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="close">&times;</button>
      <p class="modal-name" id="modalName"></p>
      <p class="modal-msg" id="modalMsg"></p>
      <div class="actions" id="modalActions"></div>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------
    // 1) මෙතන ඔයාගේ GitHub repo එකේ messages.json ෆයිල් එකේ RAW LINK එක දාන්න.
    //    උදාහරණය: https://raw.githubusercontent.com/USERNAME/REPO/main/messages.json
    // ---------------------------------------------------------------
    const GITHUB_RAW_URL = "https://raw.githubusercontent.com/raveendraabesiriwardana-lgtm/WWW.BNNNETWORK.LK/main/messages.json";

    // messages.json එකේ format එක මෙන්න මේ විදිහට තියෙන්න ඕන:
    // [
    //   { "name": "Kasun", "message": "අපේ WhatsApp group එකට එන්න!", "link": "https://chat.whatsapp.com/xxxxxxx" },
    //   { "name": "Nimali", "message": "Website එක බලන්න", "link": "https://example.com" }
    // ]

    let allMessages = [];
    const contentEl = document.getElementById('content');
    const searchEl = document.getElementById('searchInput');

    function escapeHtml(str){
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    // Text එකේ තියෙන links auto-detect කරලා clickable කරනවා
    function linkifyText(text){
      const escaped = escapeHtml(text);
      const urlPattern = /(https?:\/\/[^\s<]+)/g;
      return escaped.replace(urlPattern, (url) => {
        return `<a class="go" href="${url}" target="_blank" rel="noopener noreferrer">Link එකට යන්න →</a>`;
      });
    }

    const PREVIEW_LIMIT = 140; // මේ ගාණට වඩා දිග message නම් preview එකක් + "විස්තරය" බටනක් පෙන්නනවා
    let currentList = []; // දැනට screen එකේ පෙන්නෙන list එක (search filter වුනාට පස්සෙත් index match වෙන්න)

    function renderMessages(list){
      currentList = list;
      if(!list.length){
        contentEl.innerHTML = `<div class="empty">මේ නමට මැසේජ් හමු වුනේ නැහැ.</div>`;
        return;
      }
      contentEl.innerHTML = list.map((item, idx) => {
        const name = escapeHtml(item.name || "");
        const rawMessage = item.message || "";
        const isLong = rawMessage.length > PREVIEW_LIMIT;
        const previewText = isLong ? rawMessage.slice(0, PREVIEW_LIMIT).trim() + "..." : rawMessage;
        const message = escapeHtml(previewText);
        const hasSeparateLink = item.link && String(item.link).trim().length > 0;

        const linkTitle = (item.link_title && String(item.link_title).trim().length > 0)
          ? `<p class="link-title">🔗 මේ Link එකෙන් යන්නේ: <b>${escapeHtml(item.link_title)}</b></p>`
          : "";
        const descButton = isLong
          ? `<button type="button" class="desc-btn" data-idx="${idx}">විස්තරය බලන්න</button>`
          : "";

        return `
          <div class="card">
            <p class="name">${name}</p>
            <p class="msg">${message}</p>
            ${linkTitle}
            <div class="actions">
              ${descButton}
              ${hasSeparateLink ? `<a class="go" href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">Link එකට යන්න →</a>` : ""}
            </div>
          </div>
        `;
      }).join("");

      // "විස්තරය බලන්න" බටන් වලට click listener attach කරනවා
      contentEl.querySelectorAll('.desc-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-idx'), 10);
          openModal(currentList[idx]);
        });
      });
    }

    function openModal(item){
      if(!item) return;
      document.getElementById('modalName').textContent = item.name || "";
      document.getElementById('modalMsg').textContent = item.message || "";
      const actionsEl = document.getElementById('modalActions');
      const hasSeparateLink = item.link && String(item.link).trim().length > 0;
      const linkTitle = (item.link_title && String(item.link_title).trim().length > 0)
        ? `<p class="link-title">🔗 මේ Link එකෙන් යන්නේ: <b>${escapeHtml(item.link_title)}</b></p>`
        : "";
      actionsEl.innerHTML = hasSeparateLink
        ? `${linkTitle}<a class="go" href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">Link එකට යන්න →</a>`
        : "";
      document.getElementById('modalOverlay').classList.add('open');
    }
    function closeModal(){
      document.getElementById('modalOverlay').classList.remove('open');
    }
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if(e.target.id === 'modalOverlay') closeModal();
    });

    function filterAndRender(query){
      const q = query.trim().toLowerCase();
      if(!q){
        renderMessages(allMessages);
        return;
      }
      const filtered = allMessages.filter(item =>
        (item.name || "").toLowerCase().includes(q)
      );
      renderMessages(filtered);
    }

    async function loadMessages(){
      try{
        const res = await fetch(GITHUB_RAW_URL, { cache: "no-store" });
        if(!res.ok) throw new Error("Fetch failed: " + res.status);
        const data = await res.json();
        allMessages = Array.isArray(data) ? data : [];
        renderMessages(allMessages);
      }catch(err){
        contentEl.innerHTML = `
          <div class="status">
            Messages load කරන්න බැරි උනා 😕<br/>
            <span style="font-size:12.5px;">GITHUB_RAW_URL එක index.html ෆයිල් එකේ code එකේ correct ද කියලා check කරන්න.</span>
          </div>`;
        console.error(err);
      }
    }

    searchEl.addEventListener('input', (e) => filterAndRender(e.target.value));
    loadMessages();
  </script>

</body>
</html>
