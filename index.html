<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNN NETWORK</title>
<meta name="description" content="All BNN NETWORK official links & messages in one hub.">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fa; --bg2:#eceff5; --card:#ffffff; --text:#12203a; --muted:#5b6b85;
  --accent:#d32f2f; --accent2:#14305b; --border:#e3e7ef; --chip:#fdecec;
  --bar:rgba(255,255,255,.88); --shadow:0 10px 30px rgba(18,32,58,.08);
}
html[data-theme="dark"]{
  --bg:#0b0f14; --bg2:#10161d; --card:#131b25; --text:#eef2f7; --muted:#9db0c0;
  --accent:#ff4d4d; --accent2:#8ab4ff; --border:#202b38; --chip:#2a1416;
  --bar:rgba(11,15,20,.88); --shadow:0 10px 30px rgba(0,0,0,.5);
}
body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Sinhala','Noto Sans Tamil','Noto Sans Arabic',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s}
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 16px;background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo3d{display:inline-grid;perspective:600px;flex:0 0 auto}
.logo3d svg{width:42px;height:46px;animation:spinY 8s linear infinite;filter:drop-shadow(0 4px 10px rgba(211,47,47,.35))}
@keyframes spinY{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.logo3d svg{animation:none}}
.brand-text{display:flex;flex-direction:column;line-height:1.05}
.brand-badge{background:var(--accent);color:#fff;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:800;letter-spacing:2px;width:max-content}
.brand-text strong{font-size:20px;letter-spacing:2px;color:var(--accent2);font-weight:800}
html[data-theme="dark"] .brand-text strong{color:var(--text)}
.controls{display:flex;gap:8px;align-items:center}
.lang{width:132px;padding:9px 10px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none}
.lang:focus{border-color:var(--accent)}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:18px;cursor:pointer;color:var(--text)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;font-size:14px;font-weight:600}
.tab b{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.on b{background:rgba(255,255,255,.28)}
.searchbar{max-width:640px;margin:4px auto 0;padding:0 16px;text-align:center}
.searchbar label{font-weight:700;font-size:16px;display:block;margin-bottom:10px}
.searchbar input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;outline:none}
.searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--chip)}
.searchbar em{display:block;color:var(--muted);font-size:12.5px;margin-top:9px;font-style:normal;line-height:1.5}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:8px 16px 46px}
.hero{text-align:center;padding:30px 6px 6px}
.hero-badge{display:inline-block;background:var(--chip);color:var(--accent);padding:9px 20px;border-radius:999px;
  font-weight:800;letter-spacing:2px;font-size:12px;text-transform:uppercase}
.hero h1{font-size:clamp(27px,6vw,46px);margin:18px auto 12px;max-width:720px;line-height:1.18;color:var(--accent2)}
html[data-theme="dark"] .hero h1{color:var(--text)}
.hero p{color:var(--muted);max-width:680px;margin:0 auto 20px;line-height:1.75;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:26px}
.chip{border:1px solid var(--border);background:var(--card);padding:9px 15px;border-radius:999px;color:var(--muted);font-size:13px;font-weight:600}
.hub-card{max-width:600px;margin:0 auto;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.hub-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.hub-head h2{font-size:19px;line-height:1.25;color:var(--accent2)}
html[data-theme="dark"] .hub-head h2{color:var(--text)}
.hub-head p{color:var(--muted);font-size:13.5px;margin-top:3px}
.hub-logo{font-size:36px;flex:0 0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:13px 8px;border-radius:16px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--text)}
.stat span{font-size:20px}.stat b{font-size:18px;color:var(--accent)}.stat i{font-style:normal;font-size:12px;color:var(--muted)}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 14px}
.list-head h2{font-size:20px}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.chead h3{font-size:16px;line-height:1.35}
.plats{font-size:15px;white-space:nowrap}
.prev{color:var(--muted);font-size:13.5px;line-height:1.6;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.lrows{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:13px}
.lrow em{font-style:normal;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow i{font-style:normal;color:var(--accent)}
.lrow:hover{border-color:var(--accent)}
.more-lbl{color:var(--muted);font-size:12px}
.more{margin-top:auto;background:var(--chip);color:var(--accent);border:none;padding:10px;border-radius:12px;font-weight:700;cursor:pointer;font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;line-height:1.8}
footer{text-align:center;padding:20px;color:var(--muted);font-size:13px;border-top:1px solid var(--border)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100;backdrop-filter:blur(3px)}
.overlay[hidden]{display:none}
.modal{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:22px;position:relative}
.close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:18px;cursor:pointer}
.modal h3{padding-right:44px;font-size:19px;line-height:1.35}
.m-plats{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pchip{background:var(--chip);color:var(--accent);font-size:12px;padding:4px 10px;border-radius:999px;font-weight:700}
.modal pre{white-space:pre-wrap;word-break:break-word;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;max-height:38vh;overflow:auto;font-family:inherit;font-size:13.5px;line-height:1.65;color:var(--text)}
.modal h4{margin:14px 0 8px;font-size:15px}
.lgroup h5{margin:10px 0 6px;color:var(--muted);font-size:12px;text-transform:capitalize}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);z-index:200;font-size:13px;max-width:92vw;text-align:center;line-height:1.5}
.toast[hidden]{display:none}
</style>
</head>

 {id:'facebook', re:/facebook\.com|fb\.com/}
];
const ICONS={home:'🏠',all:'🗂️',telegram:'✈️',whatsapp:'💬',youtube:'▶️',discord:'🎧',website:'🌐',instagram:'📸',tiktok:'🎵',facebook:'👍'};
const TABS=['home','all','telegram','whatsapp','youtube','discord','website','instagram','tiktok','facebook'];

let DATA=[],activeTab='home',query='',lastModal=null,lang='en';

/* ============ helpers ============ */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanUrl=u=>String(u).replace(/\s+/g,'');
function platOf(u){for(const p of PLATFORMS){if(p.re.test(u))return p.id}return 'website'}
const norm=s=>String(s).toLowerCase().replace(/\s+/g,' ').trim();
function T(k){const d=DICTS[lang]||{};return (d[k]!=null&&d[k]!=='')?d[k]:(DICTS.en[k]||'')}
function TT(id){const d=(DICTS[lang]||{}).tabs||{};return (d[id]!=null&&d[id]!=='')?d[id]:(DICTS.en.tabs[id]||id)}
function count(id){return DATA.filter(d=>d.plats.includes(id)).length}
let toastT;
function showToast(msg){toast.textContent=msg;toast.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>toast.hidden=true,3200)}
function nativeName(code){
  if(LANGS[code])return LANGS[code].native;
  let n=code;
  try{n=new Intl.DisplayNames([code],{type:'language'}).of(code)||code}catch(e){}
  LANGS[code]={native:n};return n;
}
function setDir(code){document.documentElement.dir=RTL.includes(code)?'rtl':'ltr'}

/* ============ machine translation (any language) ============ */
async function gTr(text,code){
  const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl='+code+'&dt=t&q='+encodeURIComponent(text));
  if(!r.ok)throw 0;
  const j=await r.json();
  const out=(j[0]||[]).map(s=>s[0]).join('');
  if(!out)throw 0;return out;
}
async function mmTr(text,code){
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|'+code);
  const j=await r.json();
  const out=j&&j.responseData&&j.responseData.translatedText;
  if(!out||/MYMEMORY WARNING/i.test(out))throw 0;return out;
}
async function trText(t,code){
  try{return await gTr(t,code)}catch(e){try{return await mmTr(t,code)}catch(e2){throw 0}}
}
const TR_KEYS=['heroBadge','heroTitle','heroDesc','chip1','chip2','chip3','chip4','hubSub','searchTitle','searchDesc','searchPh','details','links','msgsWord','noResults','errTitle','errDesc','langPh','themeTip'];
const TR_TABS=['home','all','website'];
async function buildDict(code){
  const base=DICTS.en,out=JSON.parse(JSON.stringify(base));
  const jobs=TR_KEYS.map(k=>[k,null]).concat(TR_TABS.map(k=>[k,'tabs']));
  let ok=0;
  for(let i=0;i<jobs.length;i+=5){
    await Promise.all(jobs.slice(i,i+5).map(async([k,sec])=>{
      const src=sec?base[sec][k]:base[k];
      try{const t=await trText(src,code);if(sec)out[sec][k]=t;else out[k]=t;ok++}catch(e){}
    }));
  }
  return {dict:out,ok:ok};
}

/* ============ language resolve / apply ============ */
function resolveLang(v){
  const n=norm(v);if(!n)return null;
  for(const id in ALIASES){if(ALIASES[id].includes(n))return id}
  for(const id in LANGS){const nat=norm(LANGS[id].native||'');if(nat&&nat===n)return id}
  for(const c of CODES){
    const names=[norm(c)];
    if(EXTRA_ALIASES[c])EXTRA_ALIASES[c].forEach(a=>names.push(norm(a)));
    if(dnEn){try{names.push(norm(dnEn.of(c)))}catch(e){}}
    try{names.push(norm(new Intl.DisplayNames([c],{type:'language'}).of(c)))}catch(e){}
    if(names.some(x=>x&&(x===n||(n.length>=3&&(x.startsWith(n)||n.startsWith(x))))))return c;
  }
  return null;
}
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  searchInput.placeholder=T('searchPh');
  langInput.placeholder=T('langPh');
  themeBtn.title=T('themeTip');
  document.documentElement.lang=lang;
  renderTabs();renderStats();renderList();
}
function setLang(l){
  lang=l;localStorage.setItem('bnn_lang',l);
  langInput.value=nativeName(l);
  setDir(l);applyLang();
  if(!overlay.hidden&&lastModal!==null)openModal(lastModal);
}
async function useLanguage(code){
  if(code==='en'||code==='si'){setLang(code);showToast('✅ '+nativeName(code));return}
  let dict=null;
  const cached=localStorage.getItem('bnn_dict_'+code);
  if(cached){try{dict=JSON.parse(cached)}catch(e){}}
  if(!dict){
    showToast('⏳ '+nativeName(code)+' වලට පරිවර්තනය වෙමින්… / translating…');
    const r=await buildDict(code);
    if(!r.ok){showToast('⚠️ පරිවර්තන සේවාවට ළඟා විය නොහැක / translation service unreachable (internet?)');langInput.value=nativeName(lang);return}
    dict=r.dict;
    try{localStorage.setItem('bnn_dict_'+code,JSON.stringify(dict))}catch(e){}
  }
  DICTS[code]=dict;
  setLang(code);
  showToast('✅ '+nativeName(code));
}
async function tryLang(v){
  const code=resolveLang(v);
  if(!code){
    showToast('⚠️ "'+v+'" හඳුනාගන්න බැරි වුණා / not recognized — try: English, සිංහල, Tamil, Acehnese, Arabic…');
    langInput.value=nativeName(lang);return;
  }
  await useLanguage(code);
}
langInput.addEventListener('change',e=>tryLang(e.target.value));
langInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryLang(e.target.value);e.target.blur()}});

/* ============ theme ============ */
function setTheme(t){
  document.documentElement.dataset.theme=t;
  localStorage.setItem('bnn_theme',t);
  themeBtn.textContent=t==='dark'?'☀️':'🌙';
  themeBtn.title=T('themeTip');
}
themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ============ render ============ */
function renderTabs(){
  tabsEl.innerHTML=TABS.map(id=>{
    const c=id==='home'?null:(id==='all'?DATA.length:count(id));
    return '<button class="tab'+(id===activeTab?' on':'')+'" data-tab="'+id+'">'+ICONS[id]+
      ' <span>'+esc(TT(id))+'</span>'+(c!==null?'<b>'+c+'</b>':'')+'</button>';
  }).join('');
}
function renderStats(){
  const order=['all'].concat(PLATFORMS.map(p=>p.id).concat(['website']));
  statsEl.innerHTML=order.map(id=>{
    const c=id==='all'?DATA.length:count(id);
    if(!c)return '';
    return '<button class="stat" data-tab="'+id+'"><span>'+ICONS[id]+'</span><b>'+c+'</b><i>'+esc(TT(id))+'</i></button>';
  }).join('');
}
function linksFor(d,tab){return (tab==='all'||tab==='home')?d.links:d.links.filter(l=>l.plat===tab)}
function cardHTML(d,i){
  const links=linksFor(d,activeTab);
  const shown=links.slice(0,4),extra=links.length-shown.length;
  return '<article class="card" data-i="'+i+'">'+
    '<div class="chead"><h3>'+esc(d.name)+'</h3><span class="plats">'+d.plats.map(p=>ICONS[p]).join(' ')+'</span></div>'+
    '<p class="prev">'+esc(d.message)+'</p>'+
    '<div class="lrows">'+shown.map(l=>'<a class="lrow" href="'+esc(l.url)+'" target="_blank" rel="noopener"><span>'+ICONS[l.plat]+'</span><em>'+esc(l.title)+'</em><i>↗</i></a>').join('')+
    (extra>0?'<span class="more-lbl">+'+extra+'</span>':'')+'</div>'+
    '<button class="more" data-i="'+i+'">'+esc(T('details'))+'</button></article>';
}
function renderList(){
  const showList=!(activeTab==='home'&&!query);
  hero.hidden=activeTab!=='home';
  listSec.hidden=!showList;
  if(!showList)return;
  let items=DATA.map((d,i)=>({d,i}));
  if(activeTab!=='home'&&activeTab!=='all')items=items.filter(x=>x.d.plats.includes(activeTab));
  if(query){const q=query.toLowerCase();items=items.filter(x=>(x.d.name+' '+x.d.message).toLowerCase().includes(q))}
  listTitle.textContent=query?('🔍 "'+query+'"'):(ICONS[activeTab]+' '+TT(activeTab));
  countLbl.textContent=items.length+' '+T('msgsWord');
  cardsEl.innerHTML=items.length?items.map(x=>cardHTML(x.d,x.i)).join(''):'<div class="empty">'+esc(T('noResults'))+'</div>';
}
function showErr(){
  hero.hidden=false;listSec.hidden=false;listTitle.textContent='⚠️';countLbl.textContent='';
  cardsEl.innerHTML='<div class="empty"><b>⚠️ '+esc(DICTS.en.errTitle)+'</b><br>'+esc(DICTS.en.errDesc)+
    '<br><br><b>⚠️ '+esc(DICTS.si.errTitle)+'</b><br>'+esc(DICTS.si.errDesc)+'</div>';
}

/* ============ modal ============ */
function openModal(i){
  const d=DATA[i];if(!d)return;lastModal=i;
  mTitle.textContent=d.name;
  mPlats.innerHTML=d.plats.map(p=>'<span class="pchip">'+ICONS[p]+' '+p+'</span>').join('');
  mMsg.textContent=d.message;
  mLinks.innerHTML=d.plats.map(p=>{
    const ls=d.links.filter(l=>l.plat===p);if(!ls.length)return '';
    return '<div class="lgroup"><h5>'+ICONS[p]+' '+p+'</h5>'+
      ls.map(l=>'<a class="lrow" href="'+esc(l.url)+'" target="_blank" rel="noopener"><span>'+ICONS[p]+'</span><em>'+esc(l.title)+'</em><i>↗</i></a>').join('')+'</div>';
  }).join('');
  overlay.hidden=false;document.body.style.overflow='hidden';
}
function closeModal(){overlay.hidden=true;document.body.style.overflow='';lastModal=null}
$('#modalClose').onclick=closeModal;
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ============ events ============ */
tabsEl.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;activeTab=b.dataset.tab;renderTabs();renderList()});
statsEl.addEventListener('click',e=>{const b=e.target.closest('.stat');if(!b)return;activeTab=b.dataset.tab;renderTabs();renderList();listSec.scrollIntoView({behavior:'smooth',block:'start'})});
cardsEl.addEventListener('click',e=>{
  if(e.target.closest('a'))return;
  const m=e.target.closest('.more'),c=e.target.closest('.card');
  if(m||c)openModal(+(m||c).dataset.i);
});
searchInput.addEventListener('input',e=>{query=e.target.value.trim();renderList()});

/* ============ load data ============ */
async function load(){
  try{
    const r=await fetch('messages.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    const j=await r.json();
    DATA=j.map(d=>{
      const links=(d.links||[]).map(l=>{const url=cleanUrl(l.url||'');return{url:url,title:l.title||url,plat:platOf(url)}});
      return{name:d.name||'?',message:d.message||'',links:links,plats:[...new Set(links.map(l=>l.plat))]};
    });
  }catch(e){showErr()}
  applyLang();
}

/* ============ init ============ */
(function initLang(){
  const saved=localStorage.getItem('bnn_lang')||'en';
  if(saved==='en'||saved==='si'){lang=saved;return}
  const cached=localStorage.getItem('bnn_dict_'+saved);
  if(cached){try{DICTS[saved]=JSON.parse(cached);lang=saved;return}catch(e){}}
  lang='en';
})();
setTheme(localStorage.getItem('bnn_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
langInput.value=nativeName(lang);
setDir(lang);
applyLang();
load();
})();
</script>
