<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNN NETWORK</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%90%9D</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fa;--bg2:#eceff5;--card:#ffffff;--text:#12203a;--muted:#5b6b85;
  --accent:#d32f2f;--accent2:#14305b;--border:#e3e7ef;--chip:#fdecec;
  --bar:rgba(255,255,255,.88);--shadow:0 10px 30px rgba(18,32,58,.08);
  --gaming:#8b5cf6;--gaming2:#06b6d4;
  --mc:#22c55e;--mc2:#16a34a;
  --ark:#f97316;--ark2:#ef4444;
  --wa-bot:#10b981;--wa-bot2:#059669;
  --wa-channel:#2563eb;--wa-channel2:#1d4ed8;
  --wa-group:#f59e0b;--wa-group2:#d97706;
  --wa-community:#ec4899;--wa-community2:#db2777;
  --tg-bot:#00bcd4;--tg-bot2:#0097a7;
  --tg-channel:#7c3aed;--tg-channel2:#6d28d9;
  --tg-group:#f43f5e;--tg-group2:#e11d48;
  --tg-community:#84cc16;--tg-community2:#65a30d;
}
html[data-theme="dark"]{
  --bg:#0b0f14;--bg2:#10161d;--card:#131b25;--text:#eef2f7;--muted:#9db0c0;
  --accent:#ff4d4d;--accent2:#8ab4ff;--border:#202b38;--chip:#2a1416;
  --bar:rgba(11,15,20,.88);--shadow:0 10px 30px rgba(0,0,0,.5);
}
body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Sinhala','Noto Sans Tamil','Noto Sans Arabic',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s}
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 16px;background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo3d{display:inline-grid;perspective:600px;flex:0 0 auto}
.logo3d svg{width:42px;height:46px;animation:spinY 8s linear infinite;filter:drop-shadow(0 4px 10px rgba(211,47,47,.35))}
@keyframes spinY{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@media(prefers-reduced-motion:reduce){.logo3d svg,.foot-brand:hover .foot-logo{animation:none}}
.brand-text{display:flex;flex-direction:column;line-height:1.05}
.brand-badge{background:var(--accent);color:#fff;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:800;letter-spacing:2px;width:max-content}
.brand-text strong{font-size:20px;letter-spacing:2px;color:var(--accent2);font-weight:800}
html[data-theme="dark"] .brand-text strong{color:var(--text)}
.controls{display:flex;gap:8px;align-items:center}
.lang{width:132px;padding:9px 10px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none}
.lang:focus{border-color:var(--accent)}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:18px;cursor:pointer;color:var(--text)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
.tab b{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.on b{background:rgba(255,255,255,.28)}
.tab[data-tab="gaming"]{background:linear-gradient(135deg,var(--gaming),var(--gaming2));border-color:transparent;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(139,92,246,.35)}
.tab[data-tab="gaming"]:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(139,92,246,.5)}
.tab[data-tab="gaming"] b{background:rgba(255,255,255,.28)}
.tab[data-tab="whatsapp"]{background:linear-gradient(135deg,#25d366,#128c7e);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(37,211,102,.35)}
.tab[data-tab="whatsapp"]:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(37,211,102,.5)}
.tab[data-tab="whatsapp"] b{background:rgba(255,255,255,.28)}
.tab[data-tab="telegram"]{background:linear-gradient(135deg,#0088cc,#005f8c);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(0,136,204,.35)}
.tab[data-tab="telegram"]:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,136,204,.5)}
.tab[data-tab="telegram"] b{background:rgba(255,255,255,.28)}
.subtabs{display:none;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:thin;background:var(--bg)}
.subtabs.open{display:flex}
.subtab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:14px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.subtab b{border-radius:999px;font-size:11px;padding:1px 7px;color:#fff}
.subtab[data-sub="minecraft"]{border-color:var(--mc)}.subtab[data-sub="minecraft"] b{background:var(--mc)}
.subtab[data-sub="minecraft"].on{background:linear-gradient(135deg,var(--mc),var(--mc2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(34,197,94,.4)}
.subtab[data-sub="ark"]{border-color:var(--ark)}.subtab[data-sub="ark"] b{background:var(--ark)}
.subtab[data-sub="ark"].on{background:linear-gradient(135deg,var(--ark),var(--ark2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(249,115,22,.4)}
.subtab[data-sub="wbot"]{border-color:var(--wa-bot)}.subtab[data-sub="wbot"] b{background:var(--wa-bot)}
.subtab[data-sub="wbot"].on{background:linear-gradient(135deg,var(--wa-bot),var(--wa-bot2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(16,185,129,.4)}
.subtab[data-sub="wchannel"]{border-color:var(--wa-channel)}.subtab[data-sub="wchannel"] b{background:var(--wa-channel)}
.subtab[data-sub="wchannel"].on{background:linear-gradient(135deg,var(--wa-channel),var(--wa-channel2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(37,99,235,.4)}
.subtab[data-sub="wgroup"]{border-color:var(--wa-group)}.subtab[data-sub="wgroup"] b{background:var(--wa-group)}
.subtab[data-sub="wgroup"].on{background:linear-gradient(135deg,var(--wa-group),var(--wa-group2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(245,158,11,.4)}
.subtab[data-sub="wcommunity"]{border-color:var(--wa-community)}.subtab[data-sub="wcommunity"] b{background:var(--wa-community)}
.subtab[data-sub="wcommunity"].on{background:linear-gradient(135deg,var(--wa-community),var(--wa-community2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(236,72,153,.4)}
.subtab[data-sub="tbot"]{border-color:var(--tg-bot)}.subtab[data-sub="tbot"] b{background:var(--tg-bot)}
.subtab[data-sub="tbot"].on{background:linear-gradient(135deg,var(--tg-bot),var(--tg-bot2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(0,188,212,.4)}
.subtab[data-sub="tchannel"]{border-color:var(--tg-channel)}.subtab[data-sub="tchannel"] b{background:var(--tg-channel)}
.subtab[data-sub="tchannel"].on{background:linear-gradient(135deg,var(--tg-channel),var(--tg-channel2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(124,58,237,.4)}
.subtab[data-sub="tgroup"]{border-color:var(--tg-group)}.subtab[data-sub="tgroup"] b{background:var(--tg-group)}
.subtab[data-sub="tgroup"].on{background:linear-gradient(135deg,var(--tg-group),var(--tg-group2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(244,63,94,.4)}
.subtab[data-sub="tcommunity"]{border-color:var(--tg-community)}.subtab[data-sub="tcommunity"] b{background:var(--tg-community)}
.subtab[data-sub="tcommunity"].on{background:linear-gradient(135deg,var(--tg-community),var(--tg-community2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(132,204,22,.4)}
.subtab[data-sub="mall"],.subtab[data-sub="wall"],.subtab[data-sub="tall"]{border-color:var(--muted)}
.subtab[data-sub="mall"] b,.subtab[data-sub="wall"] b,.subtab[data-sub="tall"] b{background:var(--muted)}
.subtab[data-sub="mall"].on{background:linear-gradient(135deg,var(--gaming),var(--gaming2));color:#fff;border-color:transparent}
.subtab[data-sub="wall"].on{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;border-color:transparent}
.subtab[data-sub="tall"].on{background:linear-gradient(135deg,#0088cc,#005f8c);color:#fff;border-color:transparent}
.subtab:hover{transform:translateY(-1px)}
.searchbar{max-width:640px;margin:4px auto 0;padding:0 16px;text-align:center}
.searchbar label{font-weight:700;font-size:16px;display:block;margin-bottom:10px}
.searchbar input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;outline:none}
.searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--chip)}
.searchbar em{display:block;color:var(--muted);font-size:12.5px;margin-top:9px;font-style:normal;line-height:1.5}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:8px 16px 46px}
.hero{text-align:center;padding:30px 6px 6px}
.hero-badge{display:inline-block;background:var(--chip);color:var(--accent);padding:9px 20px;border-radius:999px;
  font-weight:800;letter-spacing:2px;font-size:12px;text-transform:uppercase}
.hero h1{font-size:clamp(27px,6vw,46px);margin:18px auto 12px;max-width:720px;line-height:1.18;color:var(--accent2)}
html[data-theme="dark"] .hero h1{color:var(--text)}
.hero p{color:var(--muted);max-width:680px;margin:0 auto 20px;line-height:1.75;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:26px}
.chip{border:1px solid var(--border);background:var(--card);padding:9px 15px;border-radius:999px;color:var(--muted);font-size:13px;font-weight:600}
.hub-card{max-width:600px;margin:0 auto;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.hub-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.hub-head h2{font-size:19px;line-height:1.25;color:var(--accent2)}
html[data-theme="dark"] .hub-head h2{color:var(--text)}
.hub-head p{color:var(--muted);font-size:13.5px;margin-top:3px}
.hub-logo{font-size:36px;flex:0 0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:13px 8px;border-radius:16px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--text)}
.stat span{font-size:20px}.stat b{font-size:18px;color:var(--accent)}.stat i{font-style:normal;font-size:12px;color:var(--muted)}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 14px}
.list-head h2{font-size:20px}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.chead h3{font-size:16px;line-height:1.35}
.plats{font-size:15px;white-space:nowrap}
.prev{color:var(--muted);font-size:13.5px;line-height:1.6;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.lrows{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:13px}
.lrow em{font-style:normal;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow i{font-style:normal;color:var(--accent)}
.lrow:hover{border-color:var(--accent)}
.more-lbl{color:var(--muted);font-size:12px}
.more{margin-top:auto;background:var(--chip);color:var(--accent);border:none;padding:10px;border-radius:12px;font-weight:700;cursor:pointer;font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;line-height:1.8}
.card.gaming-mc{border-left:4px solid var(--mc)}
.card.gaming-ark{border-left:4px solid var(--ark)}
.card.wa-wbot{border-left:4px solid var(--wa-bot)}
.card.wa-wchannel{border-left:4px solid var(--wa-channel)}
.card.wa-wgroup{border-left:4px solid var(--wa-group)}
.card.wa-wcommunity{border-left:4px solid var(--wa-community)}
.card.tg-tbot{border-left:4px solid var(--tg-bot)}
.card.tg-tchannel{border-left:4px solid var(--tg-channel)}
.card.tg-tgroup{border-left:4px solid var(--tg-group)}
.card.tg-tcommunity{border-left:4px solid var(--tg-community)}
footer{border-top:1px solid var(--border);padding:26px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:16px;background:var(--bg)}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:center}
.foot-links button{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 2px;font-family:inherit}
.foot-links button:hover{color:var(--accent);text-decoration:underline}
.foot-brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.foot-logo{width:30px;height:32px;opacity:.9;flex:0 0 auto}
.foot-brand:hover .foot-logo{animation:spinY 2.2s linear infinite}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100;backdrop-filter:blur(3px)}
.overlay[hidden]{display:none}
.modal{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:22px;position:relative}
.close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:18px;cursor:pointer}
.modal h3{padding-right:44px;font-size:19px;line-height:1.35}
.m-plats{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pchip{background:var(--chip);color:var(--accent);font-size:12px;padding:4px 10px;border-radius:999px;font-weight:700}
.modal pre{white-space:pre-wrap;word-break:break-word;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;max-height:38vh;overflow:auto;font-family:inherit;font-size:13.5px;line-height:1.65;color:var(--text)}
.modal h4{margin:14px 0 8px;font-size:15px}
.lgroup h5{margin:10px 0 6px;color:var(--muted);font-size:12px;text-transform:capitalize}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);z-index:200;font-size:13px;max-width:92vw;text-align:center;line-height:1.5}
.toast[hidden]{display:none}
.err-banner{position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:12px 16px;z-index:999;font-size:13px;text-align:center;display:none}
.err-banner.show{display:block}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px;transition:opacity .4s}
.loading-screen.hide{opacity:0;pointer-events:none}
.loading-spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--muted);font-size:14px}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading BNN NETWORK...</div>
</div>

<div class="err-banner" id="errBanner"></div>

<header class="topbar">
  <div class="brand">
    <span class="logo3d" aria-hidden="true">
      <svg viewBox="0 0 120 128">
        <polygon points="60,6 112,34 112,92 60,120 8,92 8,34" fill="#d32f2f" stroke="#14305b" stroke-width="7" stroke-linejoin="round"/>
        <polygon points="60,6 112,34 60,62 8,34" fill="#e53935"/>
        <polygon points="8,34 60,62 60,120 8,92" fill="#c62828"/>
        <polygon points="112,34 60,62 60,120 112,92" fill="#b71c1c"/>
        <polygon points="52,11 104,39 94,45 42,17" fill="#f4f4f4"/>
        <polygon points="31,22 83,50 73,56 21,28" fill="#f4f4f4"/>
        <polygon points="8,65 60,93 60,105 8,77" fill="#f4f4f4"/>
        <polygon points="112,65 60,93 60,105 112,77" fill="#f4f4f4"/>
        <g stroke="#14305b" stroke-width="5" fill="none" stroke-linecap="round">
          <path d="M8,34 L60,62 L112,34"/><path d="M60,62 L60,120"/>
        </g>
        <polygon points="60,6 112,34 112,92 60,120 8,92 8,34" fill="none" stroke="#14305b" stroke-width="7" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="brand-text"><small class="brand-badge">BNN</small><strong>NETWORK</strong></span>
  </div>
  <div class="controls">
    <input id="langInput" class="lang" list="langList" autocomplete="off" spellcheck="false" aria-label="Language">
    <datalist id="langList">
      <option value="English"></option><option value="\u0DC3\u0DD4\u0DB1\u0DCA\u0DBD"></option><option value="Sinhala"></option>
      <option value="Tamil"></option><option value="Hindi"></option><option value="Acehnese"></option>
      <option value="Bahasa Indonesia"></option><option value="Malay"></option><option value="Arabic"></option>
      <option value="Chinese"></option><option value="Japanese"></option><option value="Korean"></option>
      <option value="Spanish"></option><option value="French"></option><option value="German"></option><option value="Russian"></option>
    </datalist>
    <button id="themeBtn" class="icon-btn">&#x1F319;</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>
<div class="subtabs" id="subtabs"></div>

<div class="searchbar">
  <label for="searchInput" data-i18n="searchTitle"></label>
  <input id="searchInput" type="search">
  <em data-i18n="searchDesc"></em>
</div>

<main>
  <section id="hero" class="hero">
    <span class="hero-badge" data-i18n="heroBadge"></span>
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroDesc"></p>
    <div class="chips">
      <span class="chip" data-i18n="chip1"></span>
      <span class="chip" data-i18n="chip2"></span>
      <span class="chip" data-i18n="chip3"></span>
      <span class="chip" data-i18n="chip4"></span>
    </div>
    <div class="hub-card">
      <div class="hub-head">
        <div><h2 data-i18n="hubTitle"></h2><p data-i18n="hubSub"></p></div>
        <span class="hub-logo">&#x1F41D;</span>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <section id="listSec" hidden>
    <div class="list-head"><h2 id="listTitle"></h2><span id="countLbl" class="count"></span></div>
    <div id="cards" class="cards"></div>
  </section>
</main>

<footer>
  <nav class="foot-links" id="footLinks"></nav>
  <div class="foot-brand">
    <svg class="foot-logo" viewBox="0 0 120 128" aria-hidden="true">
      <polygon points="60,6 112,34 112,92 60,120 8,92 8,34" fill="#d32f2f" stroke="#14305b" stroke-width="7" stroke-linejoin="round"/>
      <polygon points="60,6 112,34 60,62 8,34" fill="#e53935"/>
      <polygon points="8,34 60,62 60,120 8,92" fill="#c62828"/>
      <polygon points="112,34 60,62 60,120 112,92" fill="#b71c1c"/>
      <polygon points="52,11 104,39 94,45 42,17" fill="#f4f4f4"/>
      <polygon points="31,22 83,50 73,56 21,28" fill="#f4f4f4"/>
      <polygon points="8,65 60,93 60,105 8,77" fill="#f4f4f4"/>
      <polygon points="112,65 60,93 60,105 112,77" fill="#f4f4f4"/>
      <g stroke="#14305b" stroke-width="5" fill="none" stroke-linecap="round">
        <path d="M8,34 L60,62 L112,34"/><path d="M60,62 L60,120"/>
      </g>
      <polygon points="60,6 112,34 112,92 60,120 8,92 8,34" fill="none" stroke="#14305b" stroke-width="7" stroke-linejoin="round"/>
    </svg>
    <span data-i18n="footer"></span>
  </div>
</footer>

<div class="overlay" id="overlay" hidden>

    // Community: ONLY exact "community" spelling
    if(/\bcommunity\b/i.test(full)&&!/\bcominiuty\b|\bcomunity\b/i.test(full)){
      if(wa.indexOf('wcommunity')<0)wa.push('wcommunity');
    }
    
    if(!wa.length)wa.push('wchannel');
  }
  
  // === GAMING CLASSIFICATION ===
  var gaming=[];
  if(/minecraft/.test(full))gaming.push('minecraft');
  if(/\bark\b/i.test(name)||/\bark\s+(server|game|survival|mod|download|link|files|group)\b/i.test(full)){
    gaming.push('ark');
  }
  
  return{tg:tg,wa:wa,gaming:gaming};
}

function gTr(text,code){
  return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl='+code+'&dt=t&q='+encodeURIComponent(text))
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(j){var out=(j[0]||[]).map(function(s){return s[0]}).join('');if(!out)throw 0;return out});
}
function mmTr(text,code){
  return fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|'+code)
    .then(function(r){return r.json()})
    .then(function(j){var out=j&&j.responseData&&j.responseData.translatedText;if(!out||/MYMEMORY WARNING/i.test(out))throw 0;return out});
}
function trText(t,code){return gTr(t,code).catch(function(){return mmTr(t,code)})}
var TR_KEYS=['heroBadge','heroTitle','heroDesc','chip1','chip2','chip3','chip4','hubSub','searchTitle','searchDesc','searchPh','details','links','msgsWord','noResults','errTitle','errDesc','langPh','themeTip'];
var TR_TABS_LIST=['home','all','website','gaming','minecraft','ark','mall','wbot','wchannel','wgroup','wcommunity','wall','tbot','tchannel','tgroup','tcommunity','tall'];
function buildDict(code){
  var base=DICTS.en,out=JSON.parse(JSON.stringify(base)),ok=0;
  var jobs=TR_KEYS.map(function(k){return[k,null]}).concat(TR_TABS_LIST.map(function(k){return[k,'tabs']}));
  function runBatch(start){
    if(start>=jobs.length)return Promise.resolve({dict:out,ok:ok});
    var batch=jobs.slice(start,start+5);
    return Promise.all(batch.map(function(pair){
      var k=pair[0],sec=pair[1];var src=sec?base[sec][k]:base[k];
      return trText(src,code).then(function(t){if(sec)out[sec][k]=t;else out[k]=t;ok++}).catch(function(){});
    })).then(function(){return runBatch(start+5)});
  }
  return runBatch(0);
}
function resolveLang(v){
  var n=normStr(v);if(!n)return null;
  for(var id in ALIASES){if(ALIASES[id].indexOf(n)>=0)return id}
  for(var id2 in LANGS){var nat=normStr(LANGS[id2].native||'');if(nat&&nat===n)return id2}
  for(var ci=0;ci<CODES.length;ci++){
    var c=CODES[ci];var names=[normStr(c)];
    if(EXTRA_ALIASES[c])EXTRA_ALIASES[c].forEach(function(a){names.push(normStr(a))});
    if(dnEn){try{names.push(normStr(dnEn.of(c)))}catch(e){}}
    try{names.push(normStr(new Intl.DisplayNames([c],{type:'language'}).of(c)))}catch(e){}
    for(var ni=0;ni<names.length;ni++){var x=names[ni];if(x&&(x===n||(n.length>=3&&(x.indexOf(n)===0||n.indexOf(x)===0))))return c}
  }
  return null;
}
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=T(el.dataset.i18n)});
  searchInput.placeholder=T('searchPh');langInput.placeholder=T('langPh');themeBtn.title=T('themeTip');
  document.documentElement.lang=lang;
  renderTabs();renderSubtabs();renderStats();renderList();renderFoot();
}
function setLang(l){lang=l;localStorage.setItem('bnn_lang',l);langInput.value=nativeName(l);setDir(l);applyLang();if(!overlay.hidden&&lastModal!==null)openModal(lastModal)}
function useLanguage(code){
  if(code==='en'||code==='si'){setLang(code);showToast(EM.check+' '+nativeName(code));return Promise.resolve()}
  var cached=localStorage.getItem('bnn_dict_'+code);
  if(cached){try{DICTS[code]=JSON.parse(cached);setLang(code);showToast(EM.check+' '+nativeName(code));return Promise.resolve()}catch(e){}}
  showToast(EM.clock+' '+nativeName(code)+' translating\u2026');
  return buildDict(code).then(function(r){
    if(!r.ok){showToast(EM.warn+' translation service unreachable');langInput.value=nativeName(lang);return}
    DICTS[code]=r.dict;try{localStorage.setItem('bnn_dict_'+code,JSON.stringify(r.dict))}catch(e){}
    setLang(code);showToast(EM.check+' '+nativeName(code));
  });
}
function tryLang(v){
  var code=resolveLang(v);
  if(!code){showToast(EM.warn+' "'+v+'" not recognized');langInput.value=nativeName(lang);return Promise.resolve()}
  return useLanguage(code);
}
langInput.addEventListener('change',function(e){tryLang(e.target.value)});
langInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();tryLang(e.target.value);e.target.blur()}});
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('bnn_theme',t);themeBtn.innerHTML=t==='dark'?EM.sun:EM.moon;themeBtn.title=T('themeTip')}
themeBtn.onclick=function(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')};

function getSub(tabId){return activeSub[tabId]||null}
function setSub(tabId,sub){activeSub[tabId]=sub}

function renderTabs(){
  tabsEl.innerHTML=TABS.map(function(id){
    var c=id==='home'?null:count(id);
    var on=(id===activeTab);
    return '<button class="tab'+(on?' on':'')+'" data-tab="'+id+'">'+ICONS[id]+
      ' <span>'+esc(TT(id))+'</span>'+(c!==null?'<b>'+c+'</b>':'')+'</button>';
  }).join('');
}
function renderSubtabs(){
  var subs=[];
  if(activeTab==='gaming')subs=GAMING_SUBS;
  else if(activeTab==='whatsapp')subs=WA_SUBS;
  else if(activeTab==='telegram')subs=TG_SUBS;
  if(!subs.length){subtabsEl.classList.remove('open');return}
  subtabsEl.classList.add('open');
  var cur=getSub(activeTab);
  subtabsEl.innerHTML=subs.map(function(id){
    var c=count(id);
    return '<button class="subtab'+(cur===id?' on':'')+'" data-sub="'+id+'">'+ICONS[id]+
      ' <span>'+esc(TT(id))+'</span><b>'+c+'</b></button>';
  }).join('');
}
function renderFoot(){footLinks.innerHTML=TABS.map(function(id){return '<button data-tab="'+id+'">'+esc(TT(id))+'</button>'}).join('')}
footLinks.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  activeTab=b.dataset.tab;
  if(activeTab==='gaming'&&!getSub('gaming'))setSub('gaming','mall');
  if(activeTab==='whatsapp'&&!getSub('whatsapp'))setSub('whatsapp','wall');
  if(activeTab==='telegram'&&!getSub('telegram'))setSub('telegram','tall');
  renderTabs();renderSubtabs();renderList();window.scrollTo({top:0,behavior:'smooth'});
});
function renderStats(){
  var order=['all'].concat(PLATFORMS.map(function(p){return p.id})).concat(['gaming','website']);
  statsEl.innerHTML=order.map(function(id){
    var c=count(id);if(!c)return '';
    return '<button class="stat" data-tab="'+id+'"><span>'+ICONS[id]+'</span><b>'+c+'</b><i>'+esc(TT(id))+'</i></button>';
  }).join('');
}
function linksFor(d,tab){
  if(tab==='all'||tab==='home')return d.links;
  if(tab==='gaming'||tab==='whatsapp'||tab==='telegram'||tab==='minecraft'||tab==='ark'||tab==='mall'||
     tab==='wbot'||tab==='wchannel'||tab==='wgroup'||tab==='wcommunity'||tab==='wall'||
     tab==='tbot'||tab==='tchannel'||tab==='tgroup'||tab==='tcommunity'||tab==='tall')return d.links;
  return d.links.filter(function(l){return l.plat===tab});
}
function cardHTML(d,i){
  var links=linksFor(d,activeTab);
  var shown=links.slice(0,4),extra=links.length-shown.length;
  var cls='';
  var curSub=getSub(activeTab);
  if(curSub==='minecraft'||activeTab==='minecraft')cls='gaming-mc';
  if(curSub==='ark'||activeTab==='ark')cls='gaming-ark';
  if(curSub==='wbot'||activeTab==='wbot')cls='wa-wbot';
  if(curSub==='wchannel'||activeTab==='wchannel')cls='wa-wchannel';
  if(curSub==='wgroup'||activeTab==='wgroup')cls='wa-wgroup';
  if(curSub==='wcommunity'||activeTab==='wcommunity')cls='wa-wcommunity';
  if(curSub==='tbot'||activeTab==='tbot')cls='tg-tbot';
  if(curSub==='tchannel'||activeTab==='tchannel')cls='tg-tchannel';
  if(curSub==='tgroup'||activeTab==='tgroup')cls='tg-tgroup';
  if(curSub==='tcommunity'||activeTab==='tcommunity')cls='tg-tcommunity';
  var platsHtml=d.plats.map(function(p){return ICONS[p]}).join(' ');
  if(d.gaming&&d.gaming.length)platsHtml+=' '+(d.gaming.map(function(g){return ICONS[g]}).join(' '));
  if(d.wa&&d.wa.length)platsHtml+=' '+(d.wa.map(function(w){return ICONS[w]}).join(' '));
  if(d.tg&&d.tg.length)platsHtml+=' '+(d.tg.map(function(t){return ICONS[t]}).join(' '));
  return '<article class="card '+cls+'" data-i="'+i+'">'+
    '<div class="chead"><h3>'+esc(d.name)+'</h3><span class="plats">'+platsHtml+'</span></div>'+
    '<p class="prev">'+esc(d.message)+'</p>'+
    '<div class="lrows">'+shown.map(function(l){return '<a class="lrow" href="'+esc(l.url)+'" target="_blank" rel="noopener"><span>'+ICONS[l.plat]+'</span><em>'+esc(l.title)+'</em><i>'+EM.arrow+'</i></a>'}).join('')+
    (extra>0?'<span class="more-lbl">+'+extra+'</span>':'')+'</div>'+
    '<button class="more" data-i="'+i+'">'+esc(T('details'))+'</button></article>';
}
function matchesSub(d,subId){
  if(subId==='mall')return d.gaming&&d.gaming.length;
  if(subId==='minecraft')return d.gaming&&d.gaming.indexOf('minecraft')>=0;
  if(subId==='ark')return d.gaming&&d.gaming.indexOf('ark')>=0;
  if(subId==='wall')return d.wa&&d.wa.length;
  if(subId==='wbot')return d.wa&&d.wa.indexOf('wbot')>=0;
  if(subId==='wchannel')return d.wa&&d.wa.indexOf('wchannel')>=0;
  if(subId==='wgroup')return d.wa&&d.wa.indexOf('wgroup')>=0;
  if(subId==='wcommunity')return d.wa&&d.wa.indexOf('wcommunity')>=0;
  if(subId==='tall')return d.tg&&d.tg.length;
  if(subId==='tbot')return d.tg&&d.tg.indexOf('tbot')>=0;
  if(subId==='tchannel')return d.tg&&d.tg.indexOf('tchannel')>=0;
  if(subId==='tgroup')return d.tg&&d.tg.indexOf('tgroup')>=0;
  if(subId==='tcommunity')return d.tg&&d.tg.indexOf('tcommunity')>=0;
  return false;
}
function renderList(){
  var curSub=getSub(activeTab);
  var showList=!(activeTab==='home'&&!query);
  hero.hidden=activeTab!=='home';
  listSec.hidden=!showList;
  if(!showList)return;
  var items=DATA.map(function(d,i){return{d:d,i:i}});
  if(activeTab==='gaming'&&curSub){items=items.filter(function(x){return matchesSub(x.d,curSub)})}
  else if(activeTab==='whatsapp'&&curSub){items=items.filter(function(x){return matchesSub(x.d,curSub)})}
  else if(activeTab==='telegram'&&curSub){items=items.filter(function(x){return matchesSub(x.d,curSub)})}
  else if(activeTab!=='home'&&activeTab!=='all'&&!curSub){items=items.filter(function(x){return x.d.plats.indexOf(activeTab)>=0})}
  if(query){var q=query.toLowerCase();items=items.filter(function(x){return(x.d.name+' '+x.d.message).toLowerCase().indexOf(q)>=0})}
  var title=ICONS[activeTab]+' '+TT(activeTab);
  if(curSub)title+=' \u203A '+TT(curSub);
  if(query)title=EM.search+' "'+query+'"';
  listTitle.textContent=title;
  countLbl.textContent=items.length+' '+T('msgsWord');
  cardsEl.innerHTML=items.length?items.map(function(x){return cardHTML(x.d,x.i)}).join(''):'<div class="empty">'+esc(T('noResults'))+'</div>';
}
function showErr(){
  hero.hidden=false;listSec.hidden=false;listTitle.textContent=EM.warn;countLbl.textContent='';
  cardsEl.innerHTML='<div class="empty"><b>'+EM.warn+' '+esc(DICTS.en.errTitle)+'</b><br>'+esc(DICTS.en.errDesc)+
    '<br><br><b>'+EM.warn+' '+esc(DICTS.si.errTitle)+'</b><br>'+esc(DICTS.si.errDesc)+'</div>';
}
function openModal(i){
  var d=DATA[i];if(!d)return;lastModal=i;
  mTitle.textContent=d.name;
  var pchips=d.plats.map(function(p){return '<span class="pchip">'+ICONS[p]+' '+p+'</span>'});
  if(d.gaming&&d.gaming.length)d.gaming.forEach(function(g){pchips.push('<span class="pchip" style="background:var(--'+(g==='minecraft'?'mc':g==='ark'?'ark':'muted')+',#888);color:#fff">'+ICONS[g]+' '+g+'</span>')});
  if(d.wa&&d.wa.length)d.wa.forEach(function(w){pchips.push('<span class="pchip" style="background:var(--'+(w==='wbot'?'wa-bot':w==='wchannel'?'wa-channel':w==='wgroup'?'wa-group':'wa-community')+',#888);color:#fff">'+ICONS[w]+' '+TT(w)+'</span>')});
  if(d.tg&&d.tg.length)d.tg.forEach(function(t){pchips.push('<span class="pchip" style="background:var(--'+(t==='tbot'?'tg-bot':t==='tchannel'?'tg-channel':t==='tgroup'?'tg-group':'tg-community')+',#888);color:#fff">'+ICONS[t]+' '+TT(t)+'</span>')});
  mPlats.innerHTML=pchips.join('');
  mMsg.textContent=d.message;
  mLinks.innerHTML=d.plats.map(function(p){
    var ls=d.links.filter(function(l){return l.plat===p});if(!ls.length)return '';
    return '<div class="lgroup"><h5>'+ICONS[p]+' '+p+'</h5>'+
      ls.map(function(l){return '<a class="lrow" href="'+esc(l.url)+'" target="_blank" rel="noopener"><span>'+ICONS[p]+'</span><em>'+esc(l.title)+'</em><i>'+EM.arrow+'</i></a>'}).join('')+'</div>';
  }).join('');
  overlay.hidden=false;document.body.style.overflow='hidden';
}
function closeModal(){overlay.hidden=true;document.body.style.overflow='';lastModal=null}
$('#modalClose').onclick=closeModal;
overlay.addEventListener('click',function(e){if(e.target===overlay)closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

tabsEl.addEventListener('click',function(e){
  var b=e.target.closest('.tab');if(!b)return;
  var id=b.dataset.tab;
  if(id===activeTab&&(id==='gaming'||id==='whatsapp'||id==='telegram')){
    if(subtabsEl.classList.contains('open')){subtabsEl.classList.remove('open');activeTab='home'}
    else{setSub(id,id==='gaming'?'mall':id==='whatsapp'?'wall':'tall')}
  }else{
    activeTab=id;
    if(id==='gaming'&&!getSub('gaming'))setSub('gaming','mall');
    if(id==='whatsapp'&&!getSub('whatsapp'))setSub('whatsapp','wall');
    if(id==='telegram'&&!getSub('telegram'))setSub('telegram','tall');
  }
  renderTabs();renderSubtabs();renderList();
});
subtabsEl.addEventListener('click',function(e){
  var b=e.target.closest('.subtab');if(!b)return;
  setSub(activeTab,b.dataset.sub);
  renderSubtabs();renderList();
});
statsEl.addEventListener('click',function(e){
  var b=e.target.closest('.stat');if(!b)return;
  var id=b.dataset.tab;activeTab=id;
  if(id==='gaming'&&!getSub('gaming'))setSub('gaming','mall');
  if(id==='whatsapp'&&!getSub('whatsapp'))setSub('whatsapp','wall');
  if(id==='telegram'&&!getSub('telegram'))setSub('telegram','tall');
  renderTabs();renderSubtabs();renderList();
  listSec.scrollIntoView({behavior:'smooth',block:'start'});
});
cardsEl.addEventListener('click',function(e){
  if(e.target.closest('a'))return;
  var m=e.target.closest('.more'),c=e.target.closest('.card');
  if(m||c)openModal(parseInt((m||c).dataset.i,10));
});
searchInput.addEventListener('input',function(e){query=e.target.value.trim();renderList()});

// ============================================================
// LOAD DATA WITH SMART CLASSIFIER
// ============================================================
function loadData(){
  return fetch('messages.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
  }).then(function(j){
    DATA=j.map(function(raw){
      var name=(raw.name||raw.title||'').trim()||'?';
      var msg=(raw.message||'').trim();
      var desc=(raw.description||'').trim();
      var fullMsg=msg+(desc?'\n\n'+desc:'');
      
      var rawLinks=raw.links||[];
      if(!rawLinks.length&&raw.link){
        rawLinks=[{url:raw.link,title:name}];
      }
      var links=rawLinks.map(function(l){
        var url=cleanUrl(l.url||'');
        return{url:url,title:l.title||url,plat:platOf(url)};
      });
      
      // Build temporary entry for classifier
      var tempEntry={name:name,message:fullMsg,links:links};
      
      // Run smart classifier
      var classified=smartClassify(tempEntry);
      
      return{name:name,message:fullMsg,links:links,
             plats:Array.from(new Set(links.map(function(l){return l.plat}))),
             gaming:classified.gaming,wa:classified.wa,tg:classified.tg};
    });
    dataLoaded=true;
  }).catch(function(e){
    console.error('Load error:',e);
    showErr();
    dataLoaded=true;
  });
}

// ============================================================
// INIT - Load data FIRST, then render with counts
// ============================================================
(function initLang(){
  var saved=localStorage.getItem('bnn_lang')||'en';
  if(saved==='en'||saved==='si'){lang=saved;return}
  var cached=localStorage.getItem('bnn_dict_'+saved);
  if(cached){try{DICTS[saved]=JSON.parse(cached);lang=saved;return}catch(e){}}
  lang='en';
})();
setTheme(localStorage.getItem('bnn_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
langInput.value=nativeName(lang);setDir(lang);

// Render skeleton first (without counts)
applyLang();

// Then load data and re-render with real counts
loadData().then(function(){
  // Hide loading screen
  if(loadingScreen){loadingScreen.classList.add('hide');setTimeout(function(){loadingScreen.style.display='none'},400)}
  // Re-render everything with actual data
  renderTabs();renderSubtabs();renderStats();renderList();
});

}catch(err){
  var banner=document.getElementById('errBanner');
  if(banner){banner.textContent='\u26A0\uFE0F Fatal error: '+err.message;banner.classList.add('show')}
  if(loadingScreen){loadingScreen.classList.add('hide');setTimeout(function(){loadingScreen.style.display='none'},400)}
  console.error(err);
}

})();
