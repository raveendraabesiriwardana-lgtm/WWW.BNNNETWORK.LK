<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BNN NETWORK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C31F26;
    --red-deep:#8F151B;
    --navy:#132B4C;
    --navy-deep:#0B1D33;
    --white:#FFFFFF;
    --off:#F5F5F3;
    --ink:#1B1B1B;
    --muted:#6B7280;
    --card-border:#E7E4DE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-deep);
    font-family:'Noto Sans Sinhala','Inter',sans-serif;
    color:var(--ink);
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .top-bar{
    height:6px;
    background:linear-gradient(90deg, var(--red) 0%, var(--white) 50%, var(--navy) 100%);
  }
  .hero{
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
    padding:32px 20px 56px;
    text-align:center;
    color:var(--white);
  }
  .logo-wrap{
    width:150px;
    height:150px;
    margin:0 auto 18px;
    background:var(--white);
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .logo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .hero h1{
    font-family:'Fraunces',serif;
    font-weight:800;
    font-size:clamp(26px,6vw,38px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
    color:var(--white);
  }
  .hero .tag{
    display:inline-block;
    background:var(--red);
    color:var(--white);
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    padding:5px 14px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .hero p{
    margin:0 auto;
    max-width:420px;
    color:#C9D2E0;
    font-size:15px;
    line-height:1.6;
  }
  .search-wrap{
    max-width:480px;
    margin:26px auto 0;
    padding:0 8px;
  }
  #searchInput{
    width:100%;
    padding:14px 18px;
    border-radius:999px;
    border:2px solid var(--red);
    font-size:16px;
    font-family:inherit;
    background:var(--white);
    color:var(--ink);
    outline:none;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  #searchInput:focus{
    box-shadow:0 0 0 3px rgba(195,31,38,0.35), 0 8px 24px rgba(0,0,0,0.25);
  }
  main{
    max-width:640px;
    margin:-30px auto 0;
    padding:0 16px 60px;
  }
  .status{
    background:var(--white);
    border-radius:16px;
    padding:18px 20px;
    color:var(--muted);
    text-align:center;
    font-size:14px;
  }
  .card{
    background:var(--white);
    border:1px solid var(--card-border);
    border-left:5px solid var(--red);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
  }
  .card .name{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:18px;
    color:var(--navy);
    margin:0 0 6px;
  }
  .card .msg{
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
    margin:0 0 12px;
    word-break:break-word;
  }
  .card a.go{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--red);
    color:var(--white);
    text-decoration:none;
    font-weight:700;
    font-size:14px;
    padding:9px 16px;
    border-radius:999px;
  }
  .card a.go:hover{ background:var(--red-deep); }
  .empty{
    text-align:center;
    color:#C9D2E0;
    padding:40px 20px;
    font-size:15px;
  }
  footer{
    text-align:center;
    padding:20px 16px 30px;
    color:#8A93A6;
    font-size:12.5px;
  }
</style>
</head>
